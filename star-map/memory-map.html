<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>酒狐 · 记忆星图</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.6 -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
         background: radial-gradient(1200px 800px at 30% 20%, #141a2e 0%, #0a0d18 60%, #06070d 100%); color: #dfe3ea; overflow: hidden; }
  #app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header { padding: 12px 18px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
           border-bottom: 1px solid #1c2233; background: #0c1019cf; backdrop-filter: blur(6px); z-index: 5; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .5px; }
  .stat { font-size: 12px; color: #8b93a7; }
  .stat b { color: #dfe3ea; font-weight: 600; }
  .spacer { flex: 1; }
  input[type=search], select { background: #111826; color: #dfe3ea; border: 1px solid #232c40;
        border-radius: 6px; padding: 5px 9px; font-size: 12px; outline: none; }
  input[type=search] { width: 180px; }
  input[type=search]:focus, select:focus { border-color: #3d5a8a; }
  #stage { position: relative; overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  canvas { display: block; cursor: crosshair; }
  #tip { position: absolute; pointer-events: none; max-width: 320px; padding: 8px 10px; border-radius: 8px;
         background: #0b1220f2; border: 1px solid #2a3550; font-size: 12px; line-height: 1.5;
         box-shadow: 0 8px 24px #0008; opacity: 0; transition: opacity .12s; z-index: 9; }
  #tip .t { color: #9fd0ff; font-size: 11px; margin-bottom: 4px; }
  #tip .m { color: #7d869b; font-size: 11px; margin-top: 4px; }
  #legend { position: absolute; left: 16px; bottom: 14px; font-size: 11px; color: #78829a; line-height: 1.9; }
  #legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  #detail { position: absolute; right: 14px; top: 14px; width: 300px; max-height: calc(100% - 28px); overflow: auto;
            background: #0b1220f0; border: 1px solid #263049; border-radius: 10px; padding: 12px; display: none; z-index: 8; }
  #detail h3 { margin: 0 0 6px; font-size: 13px; color: #9fd0ff; }
  #detail .row { font-size: 12px; color: #98a1b6; margin: 3px 0; }
  #detail .row b { color: #dfe3ea; font-weight: 500; }
  #detail .text { margin-top: 8px; font-size: 12px; color: #c8cfdd; white-space: pre-wrap; }
  #detail .close { position: absolute; right: 10px; top: 8px; cursor: pointer; color: #66708a; }
  .hint { color: #5f6b82; font-size: 11px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>记忆星图</h1>
    <span class="stat" id="s-total">…</span>
    <span class="stat" id="s-tier"></span>
    <span class="spacer"></span>
    <select id="f-conv"><option value="">全部会话</option></select>
    <select id="f-tier">
      <option value="">全部轨道</option>
      <option value="star">恒星（钉住 / 极重要）</option>
      <option value="bright">重要（常被想起）</option>
      <option value="normal">普通</option>
      <option value="faint">淡忘（低重要度）</option>
    </select>
    <input id="q" type="search" placeholder="搜记忆内容…">
    <span class="hint">滚轮缩放 · 拖动平移 · 双击看详情</span>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="tip"></div>
    <div id="legend">
      <div><i style="background:#ffd479"></i>和主人</div>
      <div><i style="background:#7fb2ff"></i>群聊</div>
      <div><i style="background:#8ee6a4"></i>私聊（其他人）</div>
      <div><i style="background:#c9a3ff"></i>B站 / 其他</div>
    </div>
    <div id="detail"><span class="close" id="d-close">✕</span><div id="d-body"></div></div>
  </div>
</div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const tip = document.getElementById('tip');
const detail = document.getElementById('detail');
const dbody = document.getElementById('d-body');
let DATA = [], view = { scale: 1, ox: 0, oy: 0 };
let hover = null, selected = null, drag = null;

const TIER = {
  star:   { label: '恒星', color: '#ffd479' },
  bright: { label: '重要', color: '#9fd0ff' },
  normal: { label: '普通', color: '#7d8aa8' },
  faint:  { label: '淡忘', color: '#4c5570' },
};

// 主人 QQ 不写进页面：优先用 ?owner=，其次 localStorage，最后按普通私聊显示
function ownerKey() {
  try {
    const q = new URLSearchParams(location.search).get('owner');
    if (q) { localStorage.setItem('mm_owner', q); return `private:${q}`; }
    const saved = localStorage.getItem('mm_owner');
    if (saved) return `private:${saved}`;
  } catch {}
  return 'private:__owner__';
}
const ownerKeyConfigured = true;

function convColor(key) {
  if (!key) return '#c9a3ff';
  if (key === ownerKey()) return '#ffd479';
  if (key.startsWith('group:')) return '#7fb2ff';
  if (key.startsWith('private:')) return '#8ee6a4';
  return '#c9a3ff';
}
function convLabel(key) {
  if (!key) return '未标注';
  if (key === ownerKey()) return '和主人（私聊）';
  if (key.startsWith('group:')) return '群 ' + key.slice(6);
  if (key.startsWith('private:')) return '私聊 ' + key.slice(8);
  return key;
}
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

function classify(r) {
  const imp = Number(r.importance) || 0;
  if (r.pinned || r.anchor || imp >= 80) return 'star';
  if (imp >= 55 || (Number(r.recallCount) || 0) >= 8) return 'bright';
  if (imp >= 30) return 'normal';
  return 'faint';
}
function weight(r) {
  const imp = Number(r.importance) || 30;
  const rc = Math.min(30, (Number(r.recallCount) || 0) * 1.5);
  const bonus = (r.pinned ? 25 : 0) + (r.anchor ? 12 : 0);
  const ageDays = Math.max(0, (Date.now() - Date.parse(r.createdAt || 0)) / 86400000);
  const agePen = Math.min(18, ageDays * 0.9);
  return Math.max(6, Math.min(100, imp + rc + bonus - agePen));
}

function layout() {
  const stageEl = document.getElementById('stage');
  const cw = stageEl.clientWidth || window.innerWidth;
  const ch = stageEl.clientHeight || (window.innerHeight - 60);
  const w = cv.width = Math.max(320, Math.round(cw * devicePixelRatio));
  const h = cv.height = Math.max(240, Math.round(ch * devicePixelRatio));
  const cx = w / 2, cy = h / 2;
  const base = Math.min(w, h) * 0.5;
  DATA.forEach((r) => {
    const imp = Number(r.importance) || 0;
    const ageDays = Math.max(0, (Date.now() - Date.parse(r.createdAt || 0)) / 86400000);
    // 重要度高 → 靠近中心；越老 → 越往外飘
    let rn = 0.16 + (1 - Math.min(100, imp) / 100) * 0.62 + Math.min(0.22, ageDays / 90 * 0.22);
    const ang = (hash(r.id) % 10000) / 10000 * Math.PI * 2;
    const rad = base * rn * 0.92;
    r.x = cx + Math.cos(ang) * rad;
    r.y = cy + Math.sin(ang) * rad * 0.92;
    r.r = 1.1 + Math.sqrt(r.weight) / 4.0;
    r.ageDays = ageDays;
  });
}

function render() {
  const w = cv.width, h = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  const cx = w / 2, cy = h / 2, base = Math.min(w, h) * 0.5;

  // 轨道环
  [0.30, 0.58, 0.86].forEach((rr) => {
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(120,140,190,0.10)';
    ctx.lineWidth = 1;
    ctx.ellipse(cx, cy, base * rr, base * rr * 0.92, 0, 0, Math.PI * 2);
    ctx.stroke();
  });

  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  DATA.forEach((r) => {
    const isHover = hover === r;
    const recent = (Date.now() - Date.parse(r.lastSeenAt || r.createdAt || 0)) / 86400000;
    const dimBase = recent < 1 ? 1 : recent < 7 ? 0.85 : recent < 21 ? 0.6 : 0.35;
    const dim = r.hidden ? 0.07 : dimBase;
    const color = convColor(r.conversationKey);
    ctx.beginPath();
    ctx.globalAlpha = dim;
    ctx.fillStyle = color;
    ctx.shadowBlur = isHover ? 18 : (r.tier === 'star' ? 14 : 6);
    ctx.shadowColor = color;
    ctx.arc(r.x, r.y, r.r * (isHover ? 1.6 : 1), 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    if (r.tier === 'star') {
      ctx.globalAlpha = dim * 0.45;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r * 2.6, 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.fill();
    }
    ctx.globalAlpha = 1;
  });
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

function pick(mx, my) {
  const rect = cv.getBoundingClientRect();
  const sx = cv.width / (rect.width || 1);
  const sy = cv.height / (rect.height || 1);
  const x = ((mx - rect.left) * sx - view.ox) / view.scale;
  const y = ((my - rect.top) * sy - view.oy) / view.scale;
  let best = null, bd = 1e9;
  DATA.forEach((r) => {
    if (r.hidden) return;
    const d = (r.x - x) ** 2 + (r.y - y) ** 2;
    if (d < (r.r + 7) ** 2 && d < bd) { bd = d; best = r; }
  });
  return best;
}

function showTip(r, mx, my) {
  tip.style.opacity = 1;
  tip.style.left = Math.min(mx + 14, window.innerWidth - 340) + 'px';
  tip.style.top = Math.min(my + 14, window.innerHeight - 120) + 'px';
  const t = TIER[r.tier];
  tip.innerHTML = `<div class="t">${t.label} · ${convLabel(r.conversationKey)}</div>` +
    `<div>${(r.title || r.text || '').slice(0, 90)}</div>` +
    `<div class="m">重要度 ${r.importance} · 被想起 ${r.recallCount || 0} 次 · ${String(r.createdAt || '').slice(0, 10)}</div>`;
}
function openDetail(r) {
  selected = r;
  const t = TIER[r.tier];
  dbody.innerHTML = `<h3>${(r.title || r.text || '').slice(0, 40)}</h3>` +
    `<div class="row">轨道：<b>${t.label}</b> · 会话：<b>${convLabel(r.conversationKey)}</b></div>` +
    `<div class="row">重要度：<b>${r.importance}</b> · 权重：<b>${Math.round(r.weight)}</b> · 想起：<b>${r.recallCount || 0}</b> 次</div>` +
    `<div class="row">清晰度：<b>${r.clarity || '-'}</b> · 衰减：<b>${r.decaySteps || 0}</b></div>` +
    `<div class="row">记录于 ${String(r.createdAt || '').slice(0, 10)} · 最近 ${String(r.lastSeenAt || '').slice(0, 10)}</div>` +
    (r.tags && r.tags.length ? `<div class="row">标签：${r.tags.slice(0, 6).join(' / ')}</div>` : '') +
    `<div class="text">${(r.text || r.title || '').slice(0, 800)}</div>` +
    (r.botReply ? `<div class="text" style="color:#9fd0ff">你回过：${String(r.botReply).slice(0, 300)}</div>` : '');
  detail.style.display = 'block';
}

async function load() {
  // 直连桥接时（?token=...）把令牌带给 JSON 接口；走插件代理时不需要
  const tk = new URLSearchParams(location.search).get('token');
  const url = tk ? `./memory-map.json?token=${encodeURIComponent(tk)}` : './memory-map.json';
  const res = await fetch(url, { cache: 'no-store' });
  const j = await res.json();
  DATA = (j.records || []).map((r) => ({ ...r, tier: classify(r), weight: weight(r) }));
  const counts = { star: 0, bright: 0, normal: 0, faint: 0 };
  DATA.forEach((r) => counts[r.tier]++);
  document.getElementById('s-total').innerHTML = `共 <b>${DATA.length}</b> 颗记忆`;
  document.getElementById('s-tier').innerHTML =
    `<b>${counts.star}</b> 恒星 · <b>${counts.bright}</b> 重要 · <b>${counts.normal}</b> 普通 · <b>${counts.faint}</b> 淡忘`;

  const sel = document.getElementById('f-conv');
  const seen = new Set();
  DATA.forEach((r) => { if (!seen.has(r.conversationKey)) { seen.add(r.conversationKey);
    const o = document.createElement('option'); o.value = r.conversationKey; o.textContent = convLabel(r.conversationKey); sel.appendChild(o); } });

  layout(); render();
  document.getElementById('s-total').title = `生成于 ${j.generatedAt || ''}`;
}

function applyFilter() {
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  const conv = document.getElementById('f-conv').value;
  const tier = document.getElementById('f-tier').value;
  DATA.forEach((r) => {
    let ok = true;
    if (conv && r.conversationKey !== conv) ok = false;
    if (tier && r.tier !== tier) ok = false;
    if (ok && q && !((r.title || '') + (r.text || '') + (r.tags || []).join(' ')).toLowerCase().includes(q)) ok = false;
    r.hidden = !ok;
  });
  render();
}

cv.addEventListener('mousemove', (e) => {
  if (drag) {
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 1) drag.moved = true;
    view.ox += (e.clientX - drag.x) * devicePixelRatio;
    view.oy += (e.clientY - drag.y) * devicePixelRatio;
    drag = { x: e.clientX, y: e.clientY, moved: drag.moved };
    render(); return;
  }
  const r = pick(e.clientX, e.clientY);
  if (r !== hover) { hover = r; render(); }
  if (r) showTip(r, e.clientX, e.clientY); else tip.style.opacity = 0;
});
cv.addEventListener('mousedown', (e) => { drag = { x: e.clientX, y: e.clientY, moved: false }; });
cv.addEventListener('mouseup', (e) => {
  if (drag && !drag.moved) { const r = pick(e.clientX, e.clientY); if (r) openDetail(r); }
  drag = null;
});

cv.addEventListener('dblclick', (e) => { const r = pick(e.clientX, e.clientY); if (r) openDetail(r); });
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 0.9;
  view.scale = Math.max(0.4, Math.min(3, view.scale * f));
  render();
}, { passive: false });
document.getElementById('q').addEventListener('input', applyFilter);
document.getElementById('f-conv').addEventListener('change', applyFilter);
document.getElementById('f-tier').addEventListener('change', applyFilter);
document.getElementById('d-close').addEventListener('click', () => { detail.style.display = 'none'; });
window.addEventListener('resize', () => { layout(); render(); });
load();
</script>
</body>
</html>
